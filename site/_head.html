<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Logs — Product Requirements v1.4</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --ink: #1a1a1a; --muted: #6b6b6b; --rule: #e5e5e2;
    --core: #0b6b3a; --core-bg: #e9f5ee;
    --cond: #8a5a00; --cond-bg: #fbf1dd;
    --what: #1f3c6e; --what-bg: #e8eef8;
    --how: #5b2a86; --how-bg: #efe6f7;
    --example-bg: #fffbeb; --example-rule: #f3d56a; --example-ink: #78350f;
    --required: #b91c1c; --required-bg: #fee2e2;
    --illustrative: #6b7280; --illustrative-bg: #f1f3f5;
    --quickcheck-bg: #fef9c3; --quickcheck-rule: #ca8a04; --quickcheck-ink: #713f12;
    --hint-bg: #ecfeff; --hint-rule: #0e7490; --hint-ink: #155e75;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; line-height: 1.55; color: var(--ink); background: var(--bg);
  }
  .layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  nav.toc {
    position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
    padding: 24px 18px; border-right: 1px solid var(--rule); background: var(--surface); font-size: 13px;
  }
  nav.toc h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 0 6px; }
  nav.toc h2:first-of-type { margin-top: 0; }
  nav.toc h2.qc { color: var(--quickcheck-ink); border-left: 3px solid var(--quickcheck-rule); padding-left: 8px; }
  nav.toc h2.what { color: var(--what); border-left: 3px solid var(--what); padding-left: 8px; }
  nav.toc h2.how { color: var(--how); border-left: 3px solid var(--how); padding-left: 8px; }
  nav.toc h2.close { color: var(--muted); border-left: 3px solid var(--muted); padding-left: 8px; }
  nav.toc ol { list-style: none; padding: 0; margin: 0; }
  nav.toc li { margin: 4px 0; }
  nav.toc li a { text-decoration: none; color: var(--ink); display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 4px; font-size: 12.5px; }
  nav.toc li a:hover { background: var(--bg); }
  nav.toc li a .ix { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 32px; font-weight: 600; }

  main { padding: 40px 56px 120px; max-width: 1080px; }
  header.doc { border-bottom: 2px solid var(--ink); padding-bottom: 20px; margin-bottom: 32px; }
  header.doc .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  header.doc h1 { font-size: 30px; margin: 6px 0 8px; line-height: 1.2; }
  header.doc p.lede { color: var(--muted); font-size: 15px; margin: 0; max-width: 75ch; }
  header.doc .meta-row { display: flex; gap: 24px; margin-top: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }

  .convention { margin-top: 14px; padding: 12px 14px; background: var(--bg); border: 1px dashed var(--rule); border-radius: 5px; font-size: 13px; }
  .convention strong { font-weight: 700; }
  .convention .badge { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin: 0 4px; vertical-align: middle; }
  .badge.req { background: var(--required-bg); color: var(--required); }
  .badge.ill { background: var(--illustrative-bg); color: var(--illustrative); }

  .quickcheck {
    margin: 28px 0 40px; background: var(--quickcheck-bg);
    border: 1px solid var(--quickcheck-rule); border-left: 5px solid var(--quickcheck-rule);
    border-radius: 6px; padding: 18px 22px;
  }
  .quickcheck h2 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--quickcheck-ink); }
  .quickcheck .qc-tag { font-size: 11px; color: var(--quickcheck-ink); opacity: 0.9; margin-bottom: 12px; }
  .quickcheck dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 14px; }
  .quickcheck dt { font-weight: 600; color: var(--quickcheck-ink); }
  .quickcheck dd { margin: 0; color: var(--ink); }

  .part-divider { margin: 56px 0 32px; padding: 28px 32px; border-radius: 8px; color: white; }
  .part-divider.what { background: var(--what); }
  .part-divider.how { background: var(--how); }
  .part-divider .label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.8; }
  .part-divider h2 { font-size: 28px; margin: 4px 0 6px; }
  .part-divider p { margin: 0; font-size: 14px; opacity: 0.92; max-width: 75ch; }
  .part-divider .author-note { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.25); font-size: 13px; font-style: italic; opacity: 0.92; }

  section.spec { margin: 40px 0; scroll-margin-top: 24px; }
  section.spec h2 { font-size: 21px; margin: 0 0 6px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  section.spec h2 .num { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  section.spec h3 { font-size: 15px; margin: 16px 0 4px; }
  .tier { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 3px; font-weight: 600; }
  .tier.core { background: var(--core-bg); color: var(--core); }
  .tier.cond { background: var(--cond-bg); color: var(--cond); }
  .tier.what { background: var(--what-bg); color: var(--what); }
  .tier.how { background: var(--how-bg); color: var(--how); }

  .expected { background: #f4f4f2; border-left: 3px solid var(--ink); padding: 10px 14px; font-size: 13px; margin: 10px 0 14px; color: #333; }
  .expected strong { font-weight: 700; }
  .hint { background: var(--hint-bg); border-left: 3px solid var(--hint-rule); padding: 8px 14px; font-size: 13px; margin: 8px 0 14px; color: var(--hint-ink); border-radius: 4px; }
  .hint strong { color: var(--hint-ink); }

  table { width: 100%; border-collapse: collapse; margin: 8px 0 14px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border: 1px solid var(--rule); vertical-align: top; }
  th { background: var(--bg); font-weight: 600; }

  .mermaid { background: var(--surface); border: 1px solid var(--rule); border-radius: 5px; padding: 14px; margin: 14px 0; text-align: center; overflow-x: auto; }

  .design-note { background: #fff7ed; border: 1px solid #fed7aa; border-left: 3px solid #c2410c; padding: 10px 14px; margin: 14px 0; font-size: 13px; border-radius: 5px; }
  .design-note strong { color: #9a3412; }

  ul.criteria { padding-left: 20px; }
  ul.criteria li { margin: 6px 0; }

  .gherkin { background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--core); padding: 12px 14px; margin: 10px 0; font-size: 13.5px; }
  .gherkin .kw { font-weight: 700; color: var(--core); }
  .gherkin .scenario { display: block; color: var(--muted); font-style: italic; margin: 4px 0 8px; font-size: 13px; }
  .gherkin .verify { margin-top: 10px; padding: 8px 12px; background: #fef9c3; border: 1px solid #fde047; border-radius: 4px; font-size: 12.5px; color: #713f12; }
  .gherkin .verify strong.v-label { color: #92400e; }
  .gherkin .verify ul { margin: 4px 0 0 0; padding-left: 18px; }
  .gherkin .verify li { margin: 3px 0; line-height: 1.5; }
  .gherkin .verify code { background: rgba(255,255,255,0.7); padding: 0.05em 0.3em; border-radius: 3px; font-size: 0.9em; }

  hr.sect-end { border: none; border-top: 1px dashed var(--rule); margin: 32px 0 0; }

  footer.checklist { margin-top: 60px; padding-top: 30px; border-top: 2px solid var(--ink); }
  footer.checklist h2 { font-size: 20px; margin-top: 0; }
  footer.checklist table { font-size: 13.5px; }
  footer.checklist td.part-cell { width: 70px; }
  footer.checklist td.tier-cell { width: 90px; }
  footer.checklist td.check { width: 80px; text-align: center; font-family: monospace; }
  footer.note { margin-top: 24px; padding: 14px; background: var(--bg); border-left: 3px solid var(--ink); font-size: 13px; }

  @media print {
    nav.toc { display: none; }
    .layout { grid-template-columns: 1fr; }
    main { padding: 20px; max-width: none; }
    section.spec, .part-divider, .quickcheck { page-break-inside: avoid; }
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    nav.toc { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--rule); }
    main { padding: 24px; }
  }
  tr.open-row td { background: var(--required-bg); }
  tr.open-row td:last-child { color: var(--required); font-weight: 600; }
  pre code { display:block; padding:12px 14px; background:#f6f6f4; border:1px solid var(--rule); border-radius:6px; overflow-x:auto; font-size:12.5px; line-height:1.5; }
</style>
